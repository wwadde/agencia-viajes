spring:
  jpa:
    show-sql: false

server:
  servlet:
    session:
      cookie:
        secure: true
  forward-headers-strategy: framework

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  frontend:
    url: ${FRONTEND_URL}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}


storage:
  location: ${STORAGE_LOCATION}
  max-file-size-bytes: ${STORAGE_MAX_FILE_SIZE:5242880}
  public-base-url: ${STORAGE_PUBLIC_BASE_URL}

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    com.zaxxer.hikari: WARN
    org.springframework: INFO






