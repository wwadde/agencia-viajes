springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # Permite que Swagger UI envíe cookies de sesión (JSESSIONID) en peticiones cross-origin
    with-credentials: true
    csrf:
#      cookie-name: XSRF-TOKEN
#      header-name: X-XSRF-TOKEN
      enabled: true
    doc-expansion: none
  api-docs:
    path: /api-docs

logging:
  level:
#    org.springframework.security: DEBUG
#    org.hibernate.SQL: DEBUG
#    com.zaxxer.hikari: DEBUG
    com.agencia: DEBUG
    org.springframework.ai.chat.observation: DEBUG


app:
  frontend:
    url: http://localhost:4200
  cors:
    allowed-origins: http://localhost:4200

storage:
  location: ${java.io.tmpdir}/agencia-images
  public-base-url: http://localhost:8080/images


management:
  endpoints:
    web:
      exposure:
        include: "*"

  opentelemetry:
    resource-attributes:
      service.name: agencia-viajes
      service.version: "1.0.0"
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces

    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs


  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics

  tracing:
    sampling:
      probability: 1.0



spring:
  ai:
    tools:
      observations:
        include-content: true
    vectorstore:
      observations:
        log-query-response: true
    chat:
      observations:
        log-prompt: true
        log-completion: true
      client:
        observations:
          log-prompt: true
  jpa:
    properties:
      hibernate:
        generate_statistics: true
    show-sql: true



